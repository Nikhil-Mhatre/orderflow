name: OrderFlow CI - Build Artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: orderflow-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Clone Github Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Microservices Modification
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/api/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'backend/worker/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
    steps:
      - name: Clone Github Repo
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Login to AWS ECR
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/api:${{ github.sha }}
  build-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
    steps:
      - name: Clone Github Repo
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Login to AWS ECR
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker/api
          file: ./backend/worker/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/worker:${{ github.sha }}
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
    steps:
      - name: Clone Github Repo
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Login to AWS ECR
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/frontend:${{ github.sha }}
# Important: see README. This workflow must be gated by successful API CI for the
# same SHA. Required branch protection is not a workflow-to-workflow dependency.

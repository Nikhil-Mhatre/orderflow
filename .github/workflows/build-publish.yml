name: Build and publish service images
on:
  push:
    branches: [main]
    paths: ["services/api/**", "services/worker/**", "services/web/**"]
  workflow_dispatch:
    inputs:
      service:
        type: choice
        description: Service to build
        required: true
        options: [api, worker, web]
permissions:
  contents: read
  id-token: write
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.out.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "matrix=$(jq -cn --arg s "$INPUT_SERVICE" '[$s]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null || true)"
          services=()
          for s in api worker web; do
            if echo "$changed" | grep -q "^services/$s/"; then services+=("$s"); fi
          done
          if [[ ${#services[@]} -eq 0 ]]; then services=(api worker web); fi
          printf '%s\n' "${services[@]}" | jq -R . | jq -s -c . > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image metadata
        id: meta
        run: |
          echo "registry=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/orderflow-dev-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          ref: main
          path: gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
      - name: Update desired image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.meta.outputs.registry }}/orderflow-dev-${{ matrix.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python3 scripts/update_gitops_image.py --repo gitops --service "$SERVICE" --image "$IMAGE" --tag "$TAG"
      - name: Commit GitOps change
        working-directory: gitops
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(${SERVICE}): deploy ${TAG}"
          git push origin main

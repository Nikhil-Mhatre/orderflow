services:
  postgres:
    image: postgres:17-alpine
    container_name: orderflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow_user
      POSTGRES_PASSWORD: orderflow-local-password

    ports:
      - "5432:5432"

    volumes:
      - orderflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  orderflow-postgres-data:

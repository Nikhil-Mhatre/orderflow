services:
  postgres:
    image: postgres:17-alpine
    container_name: orderflow-postgres-prod
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Expose PostgreSQL only if it must be accessed from the host.
    # Prefer removing this section when only order-api needs the database.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - orderflow-postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - orderflow-internal

  order-api:
    image: orderflow-order-api:${SERVICE_VERSION}

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: orderflow-order-api-prod
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432

    ports:
      - "127.0.0.1:${PORT}:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - orderflow-internal

    init: true

networks:
  orderflow-internal:
    driver: bridge

volumes:
  orderflow-postgres-prod-data:

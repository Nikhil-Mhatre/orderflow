services:
  postgres:
    image: postgres:17-alpine
    container_name: orderflow-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - orderflow-postgres-dev-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - orderflow-dev-network

  order-api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    image: orderflow-order-api:dev
    container_name: orderflow-order-api-dev
    restart: unless-stopped
    init: true

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432

    ports:
      - "127.0.0.1:${PORT}:3000"

    volumes:
      - .:/app
      - orderflow-api-node-modules:/app/node_modules

    command: pnpm run dev

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - orderflow-dev-network

volumes:
  orderflow-postgres-dev-data:
  orderflow-api-node-modules:

networks:
  orderflow-dev-network:
    driver: bridge

# pnpm workspace configuration
#
# The workspace contains independently deployable applications under apps/
# and only reusable development/tooling packages under packages/.
#
# Infrastructure such as Terraform and GitOps configuration are intentionally
# excluded from the pnpm workspace.

packages:
  # Independently buildable and deployable microservices/applications.
  # - "apps/*"

  # Shared development/tooling configuration only.
  # Do not place business/domain/runtime code here unless we make an
  # explicit architecture decision to share it.
  - "packages/*"

# pnpm's default is intentionally restrictive: dependency lifecycle/build
# scripts are not automatically trusted.
#
# If a dependency genuinely requires a build script, explicitly allow that
# package rather than enabling build scripts globally.
allowBuilds:
  esbuild: true
  unrs-resolver: set this to true or false

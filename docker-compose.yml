services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: orderflow-web
    env_file:
      - ./frontend/.env.dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: pnpm dev

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile.dev
    container_name: orderflow-api
    env_file:
      - ./backend/api/.env.dev
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/api:/app
      - api_node_modules:/app/node_modules
      - ${USERPROFILE}/.aws:/root/.aws:ro
    command: pnpm dev

  worker:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile.dev
    container_name: orderflow-worker
    env_file:
      - ./backend/worker/.env.dev
    volumes:
      - ./backend/worker:/app
      - worker_node_modules:/app/node_modules
      - ${USERPROFILE}/.aws:/root/.aws:ro
    command: pnpm dev

  postgres:
    image: postgres:18-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  api_node_modules:
  worker_node_modules:
  frontend_node_modules:
